<section class="collection py-5">
  <div class="container">
    <!-- Header -->
    <div class="row align-items-end mb-5">
      <div class="col-lg-7" data-aos="fade-right" data-aos-duration="700">
        <span class="small-title">RIO COLLECTION</span>

        <h1 class="collection-title">Discover Our Fragrances</h1>

        <p class="collection-desc">
          Discover our signature perfumes for men, women and unisex.
        </p>
      </div>

      <div
        class="col-lg-5"
        data-aos="fade-left"
        data-aos-duration="700"
        data-aos-delay="150"
      >
        <!-- Search -->
        <input
          type="text"
          class="form-control mb-3"
          placeholder="Search perfume..."
          [(ngModel)]="searchText"
          (input)="applyFilters()"
        />

        <!-- Sort -->
        <select
          class="form-select"
          [(ngModel)]="selectedSort"
          (change)="applyFilters()"
        >
          <option value="default">Sort By</option>
          <option value="low">Price Low To High</option>
          <option value="high">Price High To Low</option>
        </select>
      </div>
    </div>

    <div class="row">
      <!-- Sidebar -->
      <div
        class="col-lg-3"
        data-aos="fade-right"
        data-aos-duration="700"
        data-aos-delay="200"
      >
        <div class="filter-box">
          <h5>Collection</h5>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="category"
              value="all"
              [(ngModel)]="selectedCategory"
              (change)="applyFilters()"
            />
            <label class="form-check-label">All</label>
          </div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="category"
              value="men"
              [(ngModel)]="selectedCategory"
              (change)="applyFilters()"
            />
            <label class="form-check-label">Men</label>
          </div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="category"
              value="women"
              [(ngModel)]="selectedCategory"
              (change)="applyFilters()"
            />
            <label class="form-check-label">Women</label>
          </div>

          <div class="form-check mb-4">
            <input
              class="form-check-input"
              type="radio"
              name="category"
              value="unisex"
              [(ngModel)]="selectedCategory"
              (change)="applyFilters()"
            />
            <label class="form-check-label">Unisex</label>
          </div>

          <hr />

          <h5>Price</h5>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="price"
              value="all"
              [(ngModel)]="selectedPrice"
              (change)="applyFilters()"
            />
            <label class="form-check-label">All Prices</label>
          </div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="price"
              value="under350"
              [(ngModel)]="selectedPrice"
              (change)="applyFilters()"
            />
            <label class="form-check-label">Under 350 LE</label>
          </div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="price"
              value="350to400"
              [(ngModel)]="selectedPrice"
              (change)="applyFilters()"
            />
            <label class="form-check-label">350 - 400 LE</label>
          </div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="price"
              value="over400"
              [(ngModel)]="selectedPrice"
              (change)="applyFilters()"
            />
            <label class="form-check-label">Above 400 LE</label>
          </div>
        </div>
      </div>

      <!-- Products -->
      <div class="col-lg-9">
        <div class="row g-4">
          @for (product of filteredProducts; track product.id) {
            <div
              class="col-lg-4 col-md-6"
              data-aos="zoom-in-up"
              data-aos-duration="700"
            >
              <div class="product-card" [routerLink]="['/product', product.id]">
                <img [src]="product.image" [alt]="product.name" />

                <div class="product-info">
                  <small>
                    {{ product.category | titlecase }}
                  </small>

                  <h4>
                    {{ product.name }}
                  </h4>

                  <p>
                    {{ product.description }}
                  </p>

                  <h5>{{ product.price }} LE</h5>
                </div>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
